services:
  - type: web
    name: sniperbot
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "20.x"
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: DATA_DIR
        value: "/data"
      # Optional — users can set their own via dashboard
      - key: GMGN_API_KEY
        value: ""
      - key: GMGN_PRIVATE_KEY
        value: ""
      - key: TELEGRAM_API_ID
        value: ""
      - key: TELEGRAM_API_HASH
        value: ""
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
