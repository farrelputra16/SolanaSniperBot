services:
  - type: web
    name: sniperbot
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "20.x"
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      # Opsional — semua bisa diisi user via dashboard:
      # - GMGN_API_KEY + GMGN_PRIVATE_KEY → Settings > GMGN API
      # - TELEGRAM_API_ID + TELEGRAM_API_HASH → form login
      - key: DATA_DIR
        value: ""
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
